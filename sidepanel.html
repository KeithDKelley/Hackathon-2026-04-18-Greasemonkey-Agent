<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greasemonkey Agent</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <span>Greasemonkey Agent</span>
    <a href="settings.html" target="_blank" id="settings-link">⚙ Settings</a>
  </header>

  <!-- Shown when no API key is set -->
  <div id="no-key-banner" class="hidden">
    No API key set. <a href="settings.html" target="_blank">Add one in Settings.</a>
  </div>

  <div id="messages"></div>

  <form id="input-form">
    <textarea id="user-input" placeholder="Describe what you want to do on this page…" rows="3"></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script src="sidepanel.js"></script>
</body>
</html>
